[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniscr"
version = "0.1.0"
description = "A Greenshot-like tool for Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[project.scripts]
miniscr = "miniscr.app:main"

[dependency-groups]
dev = [
    "pygobject-stubs>=2.20.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["‹", "›"]

[tool.ruff.lint.isort]
known-first-party = ["miniscr"]

[tool.hatch.build.targets.wheel]
packages = ["src/miniscr"]

[tool.uv]
config-settings-package = { pygobject-stubs = { config = "Gtk4,Gdk4" } }